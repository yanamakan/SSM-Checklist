    <header class="auth-header">

    // --- AUTOMATIC TEMPLATE SORTING ---
    function sortTemplate() {
        CHECKLIST_TEMPLATE.sort((a, b) => a.title.localeCompare(b.title));
        CHECKLIST_TEMPLATE.forEach(cat => {
            if (cat.sections) cat.sections.sort((a, b) => a.subTitle.localeCompare(b.subTitle));
        });
    }
    sortTemplate();

    // --- AUTH LOGIC ---
    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        if (user) {
            currentUser = user;
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            userInfo.innerHTML = `<span>Welcome, ${user.displayName}</span>`;
        } else {
            currentUser = null;
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            userInfo.innerHTML = `<span>Please sign in to manage projects</span>`;
        }
        window.render(); 
    });

    // --- DATABASE SYNC ---
    onValue(ref(db, 'projects'), (snapshot) => {
        const data = snapshot.val();
        userProjects = data ? Object.values(data) : [];
        window.render();
    });

    // --- CREATION HANDLERS ---
    window.selectCommonProject = (name) => { if (name) handleProjectCreation(name); document.getElementById('commonProjectDropdown').value = ""; };
    window.createNewProject = () => { const name = prompt("Enter Project Name:"); if (name) handleProjectCreation(name); };

    async function handleProjectCreation(name) {
        if (!currentUser) return alert("Please login first!");
        const duplicate = userProjects.find(p => p.name.toLowerCase() === name.toLowerCase() && p.status === 'active');
        if (duplicate) return alert(`Error: A project named "${name}" is already active.`);

        const projectId = Date.now().toString();
        const newProject = { 
            id: projectId, 
            name: name, 
            createdBy: currentUser.displayName, 
            status: 'active', 
            expanded: true, 
            notes: "", 
            lastModified: Date.now(), 
            data: JSON.parse(JSON.stringify(CHECKLIST_TEMPLATE)) 
        };
        commonProjects = commonProjects.filter(p => p.toLowerCase() !== name.toLowerCase());
        await set(ref(db, 'projects/' + projectId), newProject);
    }

    // --- RENDERING ENGINE ---
    window.render = function() {
        updateDropdown();
        const list = document.getElementById('project-list');
        const search = document.getElementById('projectSearch')?.value.toLowerCase() || "";
        list.innerHTML = '';

        // Sort project list and internal categories
        const sorted = [...userProjects].sort((a, b) => a.name.localeCompare(b.name));

        sorted.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(search);
            const matchesStatus = showArchived ? p.status === 'archived' : p.status === 'active';
            return matchesSearch && matchesStatus;
        }).forEach(project => {
            project.data.sort((a, b) => a.title.localeCompare(b.title));

            const allTasks = project.data.flatMap(cat => cat.sections ? cat.sections.flatMap(s => s.tasks) : cat.tasks);
            const progress = (allTasks.filter(t => t.completed).length / allTasks.length) * 100 || 0;
            const lastDate = project.lastModified 
                ? new Date(project.lastModified).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                : "Never";

            const card = document.createElement('div');
            card.className = `project-card ${project.expanded ? 'expanded' : ''}`;
            card.innerHTML = `
                <div class="card-header" onclick="window.toggleExpand('${project.id}')">
                    <div style="display:flex; flex-direction:column; flex-grow:1">
                        <span class="project-title" style="font-size: 1.1rem; font-weight: bold;">${project.name}</span>
                        <div style="display:flex; gap: 10px; margin-top: 4px;">
                            <small style="color:#666;">By: ${project.createdBy || 'Unknown'}</small>
                            <small style="color:#999;">• Updated: ${lastDate}</small>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px">
                        <div class="progress-container"><div class="progress-fill" style="width: ${progress}%"></div></div>
                        <button class="print-project-btn" onclick="event.stopPropagation(); window.printProject('${project.id}')">PDF</button>
                        <button class="archive-btn" onclick="event.stopPropagation(); window.archiveProject('${project.id}')">${showArchived ? 'Restore' : 'Archive'}</button>
                        <button class="del-btn" style="background:#ff4d4d; color:white; border:none; padding:5px 10px; border-radius:4px;" 
                            onclick="event.stopPropagation(); window.deleteProject('${project.id}')">Delete</button>
                    </div>
                </div>
                <div class="checklist-content">
                    ${project.data.map(cat => renderCategory(project.id, cat)).join('')}
                    <div class="project-notes" style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
                        <label style="font-weight:bold; font-size:0.8rem;">Notes/Comments (Max 200):</label>
                        <textarea maxlength="200" style="width:100%; height:50px; margin-top:5px;" 
                            onchange="window.saveNotes('${project.id}', this.value)" 
                            onclick="event.stopPropagation()">${project.notes || ""}</textarea>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    };

    // --- HELPER FUNCTIONS ---
    function updateDropdown() {
        const dropdown = document.getElementById('commonProjectDropdown');
        if (!dropdown) return;
        dropdown.innerHTML = '<option value="">-- Select to Create --</option>';
        commonProjects.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; dropdown.appendChild(opt); });
    }

    function renderCategory(projId, cat) {
        let html = `<h3 class="category-header">${cat.title}</h3>`;
        if (cat.sections) {
            html += cat.sections.map(sec => `<div class="sub-section"><h4>${sec.subTitle}</h4>${sec.tasks.map(t => createTaskMarkup(projId, t)).join('')}</div>`).join('');
        } else {
            html += cat.tasks.map(t => createTaskMarkup(projId, t)).join('');
        }
        return html;
    }

    function createTaskMarkup(projId, t) {
        return `<div class="task-item ${t.completed ? 'completed' : ''}">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="window.toggleTask('${projId}', '${t.id}')">
                    <span>${t.text}</span>
                </div>`;
    }

    // --- PERSISTENCE ACTIONS ---
    window.saveNotes = async (id, text) => {
        const p = userProjects.find(proj => proj.id === id);
        if (p) { p.notes = text; p.lastModified = Date.now(); await set(ref(db, 'projects/' + id), p); }
    };

    window.toggleTask = async (projId, taskId) => {
        const p = userProjects.find(proj => proj.id === projId);
        p.data.forEach(cat => {
            const tasks = cat.sections ? cat.sections.flatMap(s => s.tasks) : cat.tasks;
            const t = tasks.find(item => item.id === taskId);
            if (t) t.completed = !t.completed;
        });
        p.lastModified = Date.now();
        await set(ref(db, 'projects/' + projId), p);
    };

    window.toggleExpand = async (id) => { const p = userProjects.find(proj => proj.id === id); p.expanded = !p.expanded; await set(ref(db, 'projects/' + id), p); };
    window.archiveProject = async (id) => { const p = userProjects.find(proj => proj.id === id); p.status = p.status === 'active' ? 'archived' : 'active'; await set(ref(db, 'projects/' + id), p); };
    window.deleteProject = async (id) => { if (confirm("Delete permanently?")) await remove(ref(db, 'projects/' + id)); };
    window.toggleArchiveView = () => { showArchived = !showArchived; document.getElementById('toggleArchiveBtn').innerText = showArchived ? "View Active Projects" : "View Archived Projects"; window.render(); };

    window.printProject = (id) => {
        const cards = document.querySelectorAll('.project-card');
        const targetCard = Array.from(cards).find(card => card.innerHTML.includes(`toggleExpand('${id}')`));
        if (targetCard) { targetCard.classList.add('print-focus'); window.print(); targetCard.classList.remove('print-focus'); }
    };
</script>
