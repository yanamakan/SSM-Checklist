    // --- LOGIC ---
    let userProjects = [];
    let showArchived = false;

    // REAL-TIME SYNC (Maintains State/Persistence)
    const projectsRef = ref(db, 'projects');
    onValue(projectsRef, (snapshot) => {
        const data = snapshot.val();
        // Convert the object from Firebase into an array for rendering
        userProjects = data ? Object.values(data) : [];
        window.render();
    });

    window.createNewProject = async function() {
        const name = prompt("Enter Project Name:");
        if (!name) return;
        
        const projectData = JSON.parse(JSON.stringify(CHECKLIST_TEMPLATE));
        const projectId = Date.now().toString(); 
        
        const newProject = { 
            id: projectId, 
            name: name, 
            status: 'active', 
            expanded: true, 
            data: projectData 
        };
        
        await set(ref(db, 'projects/' + projectId), newProject);
    };

    window.toggleTask = async function(projId, taskId) {
        const project = userProjects.find(p => p.id === projId.toString());
        if (!project) return;

        project.data.forEach(cat => {
            const tasks = cat.sections ? cat.sections.flatMap(s => s.tasks) : cat.tasks;
            const task = tasks.find(t => t.id === taskId);
            if (task) task.completed = !task.completed;
        });
        
        await set(ref(db, 'projects/' + projId), project);
    };

    window.toggleExpand = async function(id) {
        const p = userProjects.find(proj => proj.id === id.toString());
        if (p) {
            p.expanded = !p.expanded;
            await set(ref(db, 'projects/' + id), p);
        }
    };

    window.archiveProject = async function(id) {
        const p = userProjects.find(proj => proj.id === id.toString());
        if (p) {
            p.status = p.status === 'active' ? 'archived' : 'active';
            await set(ref(db, 'projects/' + id), p);
        }
    };

    window.deleteProject = async function(id) {
        if (confirm("Delete this project permanently?")) {
            await remove(ref(db, 'projects/' + id));
        }
    };

    window.toggleArchiveView = function() {
        showArchived = !showArchived;
        document.getElementById('toggleArchiveBtn').innerText = showArchived ? "View Active Projects" : "View Archived Projects";
        window.render();
    };

    // 5. RENDERING ENGINE
    window.render = function() {
        const list = document.getElementById('project-list');
        const searchInput = document.getElementById('projectSearch');
        const search = searchInput ? searchInput.value.toLowerCase() : "";
        list.innerHTML = '';

        const filtered = userProjects.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(search);
            const matchesStatus = showArchived ? p.status === 'archived' : p.status === 'active';
            return matchesSearch && matchesStatus;
        });

        filtered.forEach(project => {
            const allTasks = project.data.flatMap(cat => cat.sections ? cat.sections.flatMap(s => s.tasks) : cat.tasks);
            const done = allTasks.filter(t => t.completed).length;
            const progress = (done / allTasks.length) * 100 || 0;

            const card = document.createElement('div');
            card.className = `project-card ${project.expanded ? 'expanded' : ''}`;
            card.innerHTML = `
                <div class="card-header" onclick="window.toggleExpand('${project.id}')">
                    <span class="project-title">${project.name}</span>
                    <div style="display:flex; align-items:center; gap:10px">
                        <div class="progress-container"><div class="progress-fill" style="width: ${progress}%"></div></div>
                        <button class="archive-btn" onclick="event.stopPropagation(); window.archiveProject('${project.id}')">${showArchived ? 'Restore' : 'Archive'}</button>
                        <button class="del-btn" onclick="event.stopPropagation(); window.deleteProject('${project.id}')">×</button>
                    </div>
                </div>
                <div class="checklist-content">${project.data.map(cat => renderCategory(project.id, cat)).join('')}</div>
            `;
            list.appendChild(card);
        });
    };

    function renderCategory(projId, cat) {
        let html = `<h3 class="category-header">${cat.title}</h3>`;
        if (cat.sections) {
            html += cat.sections.map(sec => `<div class="sub-section"><h4 class="sub-header">${sec.subTitle}</h4>${sec.tasks.map(t => createTaskMarkup(projId, t)).join('')}</div>`).join('');
        } else {
            html += cat.tasks.map(t => createTaskMarkup(projId, t)).join('');
        }
        return html;
    }

    function createTaskMarkup(projId, t) {
        return `<div class="task-item ${t.completed ? 'completed' : ''}">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="window.toggleTask('${projId}', '${t.id}')">
                    <span>${t.text}</span>
                </div>`;
    }
